name: Verify voicepack installers

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build all fourteen hash-pinned voicepacks
        run: python scripts/build_release.py
      - name: Install, inspect, reinstall, and uninstall with bundled WeiDU
        run: python scripts/verify_installers.py
      - name: Confirm the rebuilt archives match the published 1.0.1 assets
        run: python scripts/assemble_release.py --out-dir release-check
      - name: Compile the builders and verifiers that need a local game or soundset
        run: python -m py_compile scripts/build_ajantis.py scripts/verify_ajantis.py scripts/build_viconia.py scripts/verify_viconia.py scripts/build_garithos.py scripts/verify_garithos.py
